version: '3'
services:
  veloc:
    build:
      context: .
      dockerfile: Dockerfile
    image: veloc
    container_name: veloc
    environment:
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - ABSTRACT_HOLIDAY_API_KEY=${ABSTRACT_HOLIDAY_API_KEY}
    networks:
      - dokploy-network
    ports:
    - 5000:5000
    
networks:
  dokploy-network:
    external: true
